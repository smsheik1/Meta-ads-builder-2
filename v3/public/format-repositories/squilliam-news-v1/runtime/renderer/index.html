<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squilliam News — Wiggly Format</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020b18;
      }

      body {
        position: relative;
        background:
          radial-gradient(circle at 50% 32%, rgba(32, 98, 164, .26), transparent 38%),
          linear-gradient(145deg, #020711 0%, #06182f 55%, #020813 100%);
      }

      #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      .chrome {
        position: absolute;
        inset: 0;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: .05em;
      }

      .network {
        position: absolute;
        top: 30px;
        left: 38px;
        display: flex;
        align-items: center;
        gap: 15px;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,.55));
      }

      .network-mark {
        display: grid;
        place-items: center;
        width: 92px;
        height: 54px;
        border-radius: 8px;
        background: linear-gradient(135deg, #0ccbf5, #0872e6 70%);
        color: #fff;
        font: 900 32px/1 Arial Black, Impact, sans-serif;
        letter-spacing: -.05em;
        transform: skewX(-7deg);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), 0 8px 30px rgba(0,115,235,.35);
      }

      .network-name {
        color: #d9efff;
        font-weight: 800;
        font-size: 15px;
        line-height: 1.1;
        text-shadow: 0 2px 8px #000;
      }

      .live {
        position: absolute;
        top: 35px;
        right: 40px;
        padding: 10px 14px 9px;
        border-radius: 5px;
        background: #ff314a;
        color: white;
        font-weight: 900;
        font-size: 15px;
        box-shadow: 0 6px 20px rgba(255,49,74,.32);
      }

      .live::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: white;
      }

      .lower-third {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 42px;
        filter: drop-shadow(0 -8px 20px rgba(0,0,0,.35));
      }

      .breaking {
        display: inline-flex;
        align-items: center;
        height: 36px;
        margin-left: 42px;
        padding: 0 17px;
        border-radius: 5px 5px 0 0;
        background: #ff314a;
        color: white;
        font-weight: 950;
        font-size: 15px;
      }

      .headline {
        display: flex;
        align-items: center;
        min-height: 86px;
        padding: 14px 42px 13px;
        border-top: 2px solid rgba(121,224,255,.65);
        background: linear-gradient(90deg, rgba(3,20,44,.98), rgba(8,49,88,.96) 70%, rgba(3,20,44,.98));
      }

      .headline h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(24px, 3vw, 43px);
        font-weight: 950;
        letter-spacing: -.025em;
        line-height: 1;
        text-shadow: 0 2px 6px rgba(0,0,0,.5);
      }

      .headline .location {
        margin-left: auto;
        padding-left: 30px;
        color: #7fe6ff;
        font-weight: 800;
        font-size: 14px;
        white-space: nowrap;
      }

      .ticker {
        height: 42px;
        display: flex;
        align-items: center;
        background: #f2f7fb;
        color: #09203a;
        font-size: 14px;
        font-weight: 800;
        overflow: hidden;
      }

      .ticker-label {
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 20px 0 42px;
        background: #09bfe9;
        color: #001323;
        font-weight: 950;
      }

      .ticker-copy { padding-left: 20px; white-space: nowrap; }

      #status {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 18px;
        border-radius: 7px;
        background: rgba(0, 8, 20, .82);
        color: #bceeff;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: .04em;
      }

      #play {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255,255,255,.5);
        border-radius: 999px;
        padding: 15px 24px;
        background: rgba(2, 22, 46, .9);
        color: white;
        font: 850 16px/1 inherit;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
      }

      body.capture #play,
      body.capture #status { display: none !important; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="chrome">
      <div class="network">
        <div class="network-mark">SNN</div>
        <div class="network-name">Squilliam<br />News Network</div>
      </div>
      <div class="live">Live</div>
      <div class="lower-third">
        <div class="breaking">Breaking News</div>
        <div class="headline">
          <h1 id="headline">Loading bulletin…</h1>
          <div class="location" id="location-bug">SNN</div>
        </div>
        <div class="ticker">
          <div class="ticker-label">SNN NOW</div>
          <div class="ticker-copy" id="ticker-copy">Loading promotion…</div>
        </div>
      </div>
    </div>
    <div id="status">Loading packaged broadcast…</div>
    <button id="play" hidden>Play broadcast</button>
    <script type="module" src="./app.js"></script>
  </body>
</html>
