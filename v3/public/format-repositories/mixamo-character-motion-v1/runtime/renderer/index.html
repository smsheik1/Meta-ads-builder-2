<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixamo Character Motion — Wiggly Format</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #092844; }
      body {
        position: relative;
        background:
          radial-gradient(circle at 50% 28%, rgba(255,255,255,.2), transparent 36%),
          linear-gradient(145deg, #0b3558 0%, #08718c 52%, #082b50 100%);
      }
      #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .chrome { position: absolute; inset: 0; pointer-events: none; }
      .brand {
        position: absolute; top: 31px; left: 38px; display: flex; align-items: center; gap: 12px;
        color: #fff; font-size: 14px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
        text-shadow: 0 3px 12px rgba(0,0,0,.5);
      }
      .brand::before {
        content: "W"; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px;
        background: #f9d637; color: #102641; font: 1000 25px/1 Arial Black, sans-serif;
        box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.35);
      }
      .clip {
        position: absolute; right: 38px; top: 34px; padding: 10px 16px; border-radius: 999px;
        background: rgba(3,18,36,.72); border: 1px solid rgba(255,255,255,.2); color: #d9f7ff;
        font-weight: 850; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      }
      .title {
        position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; color: white;
        font: 1000 clamp(28px, 4vw, 52px)/.95 Arial Black, Impact, sans-serif; letter-spacing: -.04em;
        text-transform: uppercase; text-shadow: 0 5px 0 rgba(3,26,51,.7), 0 10px 28px rgba(0,0,0,.38);
      }
      .title span { display: inline-block; padding: 13px 25px 15px; border-radius: 17px; background: rgba(3,26,51,.72); }
      #error {
        display: none; position: absolute; inset: 24px; place-items: center; padding: 40px; color: white;
        background: #6d1421; font: 700 22px/1.4 ui-monospace, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="chrome">
      <div class="brand">Character Motion Lab</div>
      <div class="clip" id="clip-label">Loading motion</div>
      <div class="title"><span id="title">Loading character</span></div>
    </div>
    <div id="error"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
